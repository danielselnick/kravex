# kvx_file_to_esdb.toml — Complete Reference Configuration
# File source → Elasticsearch sink. Every config field documented.
#
# 🔧 Config loading: TOML merged with KVX_* env vars (env wins on conflicts).
#    Powered by Figment. No manual parsing. No regrets. 🦆
#
# 📐 TOML NESTING RULES (tribal knowledge, commit to memory):
#   Source common_config → NOT flattened → needs [source_config.*.common_config] sub-table
#   Sink   common_config → IS  flattened → max_drum_size_bytes at same level as url/file_name
#
# 📐 DEFAULT BEHAVIOR (the dual-default trap):
#   Source common_config:
#     Section ABSENT  → Default::default() kicks in: 1,000 docs / 1 MiB
#     Section PRESENT → serde field defaults kick in: 10,000 docs / 10 MiB
#     (yes, these differ. yes, it's intentional. yes, we're committed to both.)
#   Sink max_drum_size_bytes:
#     Field ABSENT → serde field default: 10 MiB
#     (Default::default() = 64 MiB is only used programmatically, e.g. InMemory)

# ============================================================
# ⚙️  Runtime — worker counts and channel capacities
# ============================================================
# Defaults are CPU-aware. Example values below assume 8-core machine.
# Formulas:
#   refiner_count               = num_cpus - 1                  (7 on 8-core)
#   pumper_to_refiner_capacity  = refiner_count × 4        (28)
#   refiner_to_drainer_capacity = refiner_count × 4        (28)
#   sink_parallelism           = refiner_count × 12       (84)

 [runtime]
 refiner_count = 4
 pumper_to_refiner_capacity = 2
 refiner_to_drainer_capacity = 2
 sink_parallelism = 16

# ============================================================
# 📂 Source — File (active)
# ============================================================
[source_config.File]
file_name = "datasets/geonames.json"

[source_config]

# Source common_config is a sub-table (NOT flattened).
# Absent section → Default::default(): 1,000 docs / 1,048,576 bytes (1 MiB)
# Present section with missing fields → serde defaults: 10,000 docs / 10,485,760 bytes (10 MiB)
[source_config.File.common_config]
max_batch_size_bytes = 8000000    # 32 MiB — benchmark override
max_batch_size_docs = 1000000      # 1M docs — benchmark override

# ============================================================
# 📡 Sink — Elasticsearch (active)
# ============================================================
# Sink common_config is FLATTENED — max_drum_size_bytes lives at this level.
[sink_config.Elasticsearch]
url = "http://localhost:9200"
index = "test-123"                      # Optional — each doc can carry its own _index
# username = "elastic"                  # 🔒 Basic auth username
# password = "changeme"                # 🔒 Basic auth password
# api_key = "base64-encoded-api-key"   # 🔒 API key auth (preferred over basic)
max_drum_size_bytes = 1000000        # 4 MiB — benchmark override (serde default: 10,485,760 / 10 MiB)

# ============================================================
# 🎚️  Governor — adaptive throttling (optional)
# ============================================================
# Absent → pipeline runs at fixed max_drum_size_bytes. No regulation. No drama.
# Present → spawns governor, dynamically adjusts drum size
# based on drain barrelback (latency, throughput).
#[governor.Latency]
# set_point_latency_ms = 200            # 🎯 Target drain latency in ms
# min_request_size_bytes = 131072       # 📏 PID floor: 128 KiB
# initial_output_bytes = 4194304        # 📊 Starting flow rate: 4 MiB
#[governor.Latency]
# set_point_latency_ms = 200            # 🎯 Target drain latency (ms)
# min_request_size_bytes = 131072       # 📏 PID floor: 128 KiB
# initial_output_bytes = 4194304        # 📊 Starting flow rate: 4 MiB
#[governor.Throughput]
#min_request_size_bytes = 131072         # 📏 Floor: 128 KiB
#initial_output_bytes = 4194304          # 📊 Start at 4 MiB, hill climber finds the peak
# window_duration_secs = 5             # ⏱️  Evaluation window (default: 5s)
# improvement_threshold_pct = 10.0     # 📈 Step forward when median improves >10%
# degradation_threshold_pct = 20.0     # 📉 Circuit breaker trips at 20% EMA drop
# re_explore_after_windows = 30        # 🔍 Re-explore after 30 quiet windows
[governor.Static]
output_bytes = 10000000
# ============================================================
# 📡 Source — Elasticsearch (commented-out reference)
# ============================================================
# [source_config.Elasticsearch]
# url = "http://localhost:9200"
# username = "elastic"                  # 🔒 Optional basic auth
# password = "changeme"                # 🔒 Optional basic auth
# api_key = "base64-encoded-api-key"   # 🔒 Optional API key auth
#
# # Source common_config is a sub-table (NOT flattened).
# [source_config.Elasticsearch.common_config]
# max_batch_size_docs = 10000           # serde default: 10,000
# max_batch_size_bytes = 10485760       # serde default: 10,485,760 (10 MiB)

# ============================================================
# 📂 Sink — File (commented-out reference)
# ============================================================
# Sink common_config is FLATTENED — max_drum_size_bytes at same level as file_name.
# [sink_config.File]
# file_name = "output.json"
# max_drum_size_bytes = 10485760     # serde default: 10 MiB

# ============================================================
# 🧪 InMemory — unit variants, test-only (commented-out reference)
# ============================================================
